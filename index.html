<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />

    <!-- SEO -->
    <title>ErgoBreak — Ergonomic Workstation & Screen-Break Pacer</title>
    <meta
      name="description"
      content="A free productivity app for desk workers. Customizable 20-20-20 eye-rest timer, desk-stretch reminders, guided micro-exercises, Picture-in-Picture mini timer, and browser notifications."
    />
    <meta name="keywords" content="20-20-20 rule, eye strain, desk exercises, ergonomic, break timer, productivity" />

    <!-- Open Graph -->
    <meta property="og:title" content="ErgoBreak — Ergonomic Workstation Timer" />
    <meta property="og:description" content="Protect your eyes and body with the 20-20-20 rule and guided desk exercises." />
    <meta property="og:type" content="website" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Prevent flash of wrong theme -->
    <script>
      try {
        const s = localStorage.getItem('ergobreak:v1:settings');
        const parsed = s ? JSON.parse(s) : null;
        const theme = parsed?.appearance?.theme ?? 'system';
        if (
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch {
        // localStorage may not be available — ignore
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
